<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<title>Clima Alerta</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #05070d; color: #fff; overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
  .app {
    position: relative; z-index: 1; min-height: 100vh;
    max-width: 680px; margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 18px) 16px 48px;
  }
  .card {
    background: rgba(8, 14, 26, 0.42);
    border: 1px solid rgba(255, 255, 255, 0.10);
    backdrop-filter: blur(14px) saturate(1.3);
    -webkit-backdrop-filter: blur(14px) saturate(1.3);
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 14px;
  }
  header.hero { text-align: center; padding: 10px 0 22px; }
  .city { font-size: 15px; letter-spacing: .04em; text-transform: uppercase; opacity: .72; }
  .temp { font-size: 82px; font-weight: 200; line-height: 1; margin: 6px 0 2px; letter-spacing: -.04em; }
  .cond { font-size: 17px; opacity: .92; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .feels { font-size: 13px; opacity: .66; margin-top: 6px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .cell { text-align: center; }
  .cell .k { font-size: 10.5px; opacity: .58; text-transform: uppercase; letter-spacing: .08em; }
  .cell .v { font-size: 16px; font-weight: 500; margin-top: 3px; }
  .section-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: .12em;
    opacity: .55; margin: 22px 4px 10px;
  }
  .hours { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
  .hours::-webkit-scrollbar { display: none; }
  .hour {
    flex: 0 0 62px; text-align: center; padding: 10px 4px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 14px;
  }
  .hour .h { font-size: 10.5px; opacity: .6; }
  .hour .i { font-size: 19px; margin: 5px 0; }
  .hour .t { font-size: 13px; font-weight: 500; }
  .preview { display: flex; flex-wrap: wrap; gap: 8px; }
  .preview button {
    flex: 1 1 auto; min-width: 88px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    color: #fff; font-size: 12px; padding: 10px 6px;
    border-radius: 12px; cursor: pointer; transition: .18s;
    font-family: inherit;
  }
  .preview button:hover, .preview button.on {
    background: rgba(120,180,255,0.28);
    border-color: rgba(120,180,255,0.55);
  }
  .status { font-size: 11px; opacity: .45; text-align: center; margin-top: 18px; line-height: 1.6; }
  select {
    background: rgba(255,255,255,0.08); color: #fff;
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 10px; padding: 9px 12px; font-size: 13px;
    font-family: inherit; width: 100%;
  }
  select option { background: #141a24; }
</style>
</head>
<body>

<canvas id="sky"></canvas>

<div class="app">
  <header class="hero">
    <div class="city" id="city">Carregando…</div>
    <div class="temp" id="temp">--°</div>
    <div class="cond" id="cond"><span id="icon">⏳</span><span id="label">Buscando clima</span></div>
    <div class="feels" id="feels">—</div>
  </header>

  <div class="card">
    <div class="grid">
      <div class="cell"><div class="k">Umidade</div><div class="v" id="hum">—</div></div>
      <div class="cell"><div class="k">Vento</div><div class="v" id="wind">—</div></div>
      <div class="cell"><div class="k">Pressão</div><div class="v" id="press">—</div></div>
      <div class="cell"><div class="k">Chuva</div><div class="v" id="precip">—</div></div>
      <div class="cell"><div class="k">UV</div><div class="v" id="uv">—</div></div>
      <div class="cell"><div class="k">Visibilidade</div><div class="v" id="vis">—</div></div>
    </div>
  </div>

  <div class="section-title">Previsão por hora</div>
  <div class="hours" id="hours"></div>

  <div class="section-title">Efeitos visuais — simular clima</div>
  <div class="card">
    <div class="preview" id="preview">
      <button data-type="clear">☀️ Sol</button>
      <button data-type="partly-cloudy">⛅ Parcial</button>
      <button data-type="cloudy">☁️ Nublado</button>
      <button data-type="drizzle">🌦️ Garoa</button>
      <button data-type="rain">🌧️ Chuva</button>
      <button data-type="storm">⛈️ Tempestade</button>
      <button data-type="snow">❄️ Neve</button>
      <button data-type="fog">🌫️ Neblina</button>
      <button data-toggle="daynight">🌗 Dia/Noite</button>
    </div>
  </div>

  <div class="section-title">Cidade</div>
  <div class="card">
    <select id="citySel">
      <option value="-23.5505,-46.6333">São Paulo (capital)</option>
      <option value="-22.9068,-43.1729">Rio de Janeiro</option>
      <option value="-22.9099,-47.0626">Campinas</option>
      <option value="-23.9608,-46.3336">Santos</option>
      <option value="-23.1896,-45.8841">São José dos Campos</option>
      <option value="-21.1775,-47.8103">Ribeirão Preto</option>
      <option value="-23.5015,-47.4526">Sorocaba</option>
      <option value="-22.3145,-49.0606">Bauru</option>
    </select>
  </div>

  <div class="status" id="status">Fonte: Open-Meteo · efeitos gerados localmente</div>
</div>

<script>
/* =========================================================
   CLIMA ALERTA — Efeitos climáticos dinâmicos
   ========================================================= */

/* ---------- utilidades ---------- */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp  = (a, b, t) => a + (b - a) * t;
const rand  = (a, b) => a + Math.random() * (b - a);
const hex2rgb = h => {
  h = h.replace('#', '');
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
};
const mixRgb = (a, b, t) => [lerp(a[0],b[0],t), lerp(a[1],b[1],t), lerp(a[2],b[2],t)];
const css    = c => `rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;

/* ---------- códigos WMO ---------- */
const WMO = {
  0:  { label: 'Céu limpo',                 icon: '☀️', type: 'clear',         intensity: 0    },
  1:  { label: 'Predominantemente limpo',   icon: '🌤️', type: 'clear',         intensity: 0    },
  2:  { label: 'Parcialmente nublado',      icon: '⛅', type: 'partly-cloudy', intensity: 0    },
  3:  { label: 'Nublado',                   icon: '☁️', type: 'cloudy',        intensity: 0    },
  45: { label: 'Neblina',                   icon: '🌫️', type: 'fog',           intensity: 0    },
  48: { label: 'Neblina com geada',         icon: '🌫️', type: 'fog',           intensity: 0    },
  51: { label: 'Garoa fraca',               icon: '🌦️', type: 'drizzle',       intensity: .25  },
  53: { label: 'Garoa',                     icon: '🌦️', type: 'drizzle',       intensity: .35  },
  55: { label: 'Garoa forte',               icon: '🌧️', type: 'drizzle',       intensity: .5   },
  61: { label: 'Chuva fraca',               icon: '🌧️', type: 'rain',          intensity: .45  },
  63: { label: 'Chuva',                     icon: '🌧️', type: 'rain',          intensity: .7   },
  65: { label: 'Chuva forte',               icon: '🌧️', type: 'heavy-rain',    intensity: .95  },
  66: { label: 'Chuva congelante',          icon: '🌧️', type: 'rain',          intensity: .7   },
  67: { label: 'Chuva congelante forte',    icon: '🌧️', type: 'heavy-rain',    intensity: .95  },
  71: { label: 'Neve fraca',                icon: '🌨️', type: 'snow',          intensity: .3   },
  73: { label: 'Neve',                      icon: '🌨️', type: 'snow',          intensity: .6   },
  75: { label: 'Neve forte',                icon: '❄️', type: 'snow',          intensity: .95  },
  77: { label: 'Grãos de neve',             icon: '🌨️', type: 'snow',          intensity: .4   },
  80: { label: 'Pancadas de chuva',         icon: '🌦️', type: 'rain',          intensity: .5   },
  81: { label: 'Pancadas moderadas',        icon: '🌧️', type: 'rain',          intensity: .7   },
  82: { label: 'Pancadas fortes',           icon: '⛈️', type: 'heavy-rain',    intensity: .95  },
  85: { label: 'Pancadas de neve',          icon: '🌨️', type: 'snow',          intensity: .5   },
  86: { label: 'Pancadas de neve fortes',   icon: '❄️', type: 'snow',          intensity: .85  },
  95: { label: 'Tempestade',                icon: '⛈️', type: 'storm',         intensity: 1    },
  96: { label: 'Tempestade com granizo',    icon: '⛈️', type: 'storm',         intensity: 1    },
  99: { label: 'Tempestade severa',         icon: '⛈️', type: 'storm',         intensity: 1    },
};
const getWMO = c => WMO[c] || WMO[0];

/* ---------- paletas de céu ---------- */
const SKY = {
  clearDay:    ['#1d6fd0', '#4ea1e0', '#a8d8f5'],
  clearNight:  ['#03060f', '#0a1226', '#18243f'],
  cloudyDay:   ['#5c6b7a', '#7e8d9b', '#a9b6c1'],
  cloudyNight: ['#0a0e15', '#151c27', '#232c3a'],
  rainDay:     ['#2f3a47', '#44515f', '#5e6b78'],
  rainNight:   ['#070a10', '#10161f', '#1c242f'],
  stormDay:    ['#141922', '#222a36', '#333d4a'],
  stormNight:  ['#03050a', '#0a0f16', '#131a24'],
  fogDay:      ['#7d8790', '#98a2ab', '#c0c8ce'],
  fogNight:    ['#141920', '#1e242c', '#2b333c'],
};
const rgb = obj => obj.map(hex2rgb);

/* =========================================================
   MOTOR DE EFEITOS
   ========================================================= */
class WeatherEffects {
  constructor(canvas) {
    this.c = canvas;
    this.ctx = canvas.getContext('2d');
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.w = 0; this.h = 0;
    this.t = 0;

    this.state = {
      type: 'clear',
      isDay: true,
      nightFactor: 0,
      cloudCover: 0,
      windSpeed: 0,
      intensity: 0,
      sunProgress: 0.5,
      moonPhase: 0.5,
    };

    this.rain = []; this.snow = []; this.clouds = []; this.stars = [];
    this.cloudSprites = [];
    this.dirty = true;

    this.lightning = { next: rand(2, 6), alpha: 0, bolt: null, boltLife: 0 };

    this.resize();
    addEventListener('resize', () => this.resize());

    this.loop = this.loop.bind(this);
    requestAnimationFrame(this.loop);
  }

  /* ---------- aplica dados reais ---------- */
  apply(data) {
    const code = data.code ?? 0;
    const info = getWMO(code);
    this.state.type        = info.type;
    this.state.intensity   = clamp((data.precip ?? 0) / 6, 0, 1) * 0.6 + info.intensity * 0.6;
    this.state.cloudCover  = clamp(data.cloudCover ?? 0, 0, 100);
    this.state.windSpeed   = data.windSpeed ?? 0;
    this.state.isDay       = data.isDay !== false;
    this.state.nightFactor = data.nightFactor ?? (this.state.isDay ? 0 : 1);
    this.state.sunProgress = data.sunProgress ?? 0.5;
    this.state.moonPhase   = data.moonPhase ?? 0.5;
    this.dirty = true;
  }

  /* ---------- preview manual ---------- */
  preview(type, isDay) {
    const map = {
      clear: 0, 'partly-cloudy': 2, cloudy: 3, drizzle: 53,
      rain: 63, storm: 95, snow: 73, fog: 45,
    };
    const info = getWMO(map[type] ?? 0);
    this.state.type        = info.type;
    this.state.intensity   = info.intensity;
    this.state.cloudCover  = { clear: 5, 'partly-cloudy': 45, cloudy: 95, drizzle: 90, rain: 100, storm: 100, snow: 100, fog: 100 }[type] ?? 0;
    this.state.isDay       = isDay;
    this.state.nightFactor = isDay ? 0 : 1;
    this.dirty = true;
  }

  resize() {
    const w = innerWidth, h = innerHeight;
    this.w = w; this.h = h;
    this.c.width  = w * this.dpr;
    this.c.height = h * this.dpr;
    this.c.style.width  = w + 'px';
    this.c.style.height = h + 'px';
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    this.dirty = true;
    this.build();
  }

  /* ---------- constrói partículas conforme estado ---------- */
  build() {
    const { type, cloudCover, intensity, nightFactor } = this.state;
    const w = this.w, h = this.h;

    /* nuvens */
    const nClouds = Math.round(cloudCover / 100 * 14);
    this.clouds = [];
    for (let i = 0; i < nClouds; i++) {
      this.clouds.push({
        sprite: this.cloudSprites[i % this.cloudSprites.length] || this.makeCloudSprite(),
        x: rand(-200, w + 200),
        y: rand(-40, h * 0.62),
        s: rand(0.55, 1.5),
        v: rand(4, 16),
        a: rand(0.35, 0.85),
      });
    }
    // garantir sprites
    if (!this.cloudSprites.length) {
      for (let i = 0; i < 5; i++) this.cloudSprites.push(this.makeCloudSprite());
    }

    /* chuva */
    this.rain = [];
    let drops = 0;
    if (type === 'drizzle')     drops = 140;
    else if (type === 'rain')   drops = 320;
    else if (type === 'heavy-rain') drops = 620;
    else if (type === 'storm')  drops = 520;
    drops = Math.round(drops * (0.55 + intensity * 0.6));
    for (let i = 0; i < drops; i++) this.rain.push(this.makeDrop(true));

    /* neve */
    this.snow = [];
    if (type === 'snow') {
      const n = Math.round(120 * (0.5 + intensity));
      for (let i = 0; i < n; i++) this.snow.push(this.makeFlake(true));
    }

    /* estrelas */
    this.stars = [];
    const nStars = nightFactor > 0.15 ? Math.round(170 * nightFactor) : 0;
    for (let i = 0; i < nStars; i++) {
      this.stars.push({
        x: Math.random() * w,
        y: Math.random() * h * 0.75,
        r: rand(0.5, 1.6),
        ph: Math.random() * Math.PI * 2,
        sp: rand(0.5, 2),
      });
    }
    this.dirty = false;
  }

  makeDrop(anywhere) {
    const intensity = this.state.intensity;
    return {
      x: rand(-50, this.w + 50),
      y: anywhere ? rand(-this.h, this.h) : rand(-60, -10),
      len: rand(10, 22) * (0.7 + intensity),
      spd: rand(700, 1300) * (0.7 + intensity * 0.7),
      th:  rand(0.7, 1.5),
      a:   rand(0.18, 0.5),
    };
  }

  makeFlake(anywhere) {
    return {
      x: rand(0, this.w),
      y: anywhere ? rand(0, this.h) : rand(-40, -10),
      r: rand(1, 3.2),
      spd: rand(28, 70),
      drift: rand(-18, 18),
      ph: Math.random() * Math.PI * 2,
      a: rand(0.4, 0.95),
    };
  }

  makeCloudSprite() {
    const W = 260, H = 150;
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const g = cv.getContext('2d');
    const blobs = 9 + Math.floor(Math.random() * 6);
    for (let i = 0; i < blobs; i++) {
      const x = W * 0.18 + Math.random() * W * 0.64;
      const y = H * 0.45 + Math.random() * H * 0.28;
      const r = W * (0.07 + Math.random() * 0.13);
      const grd = g.createRadialGradient(x, y, 0, x, y, r);
      grd.addColorStop(0,   'rgba(255,255,255,0.92)');
      grd.addColorStop(0.6, 'rgba(255,255,255,0.42)');
      grd.addColorStop(1,   'rgba(255,255,255,0)');
      g.fillStyle = grd;
      g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
    }
    return cv;
  }

  /* ---------- cores do céu ---------- */
  skyPalette() {
    const { type, nightFactor, sunProgress } = this.state;
    let dayKey = 'clearDay', nightKey = 'clearNight';
    if (type === 'cloudy' || type === 'partly-cloudy') { dayKey = 'cloudyDay'; nightKey = 'cloudyNight'; }
    else if (type === 'fog')  { dayKey = 'fogDay';  nightKey = 'fogNight'; }
    else if (type === 'rain' || type === 'heavy-rain' || type === 'drizzle') { dayKey = 'rainDay'; nightKey = 'rainNight'; }
    else if (type === 'storm'){ dayKey = 'stormDay'; nightKey = 'stormNight'; }

    const d = rgb(SKY[dayKey]), n = rgb(SKY[nightKey]);
    const out = d.map((c, i) => mixRgb(c, n[i], nightFactor));

    // tom dourado no nascer/pôr do sol
    if (nightFactor < 0.6) {
      const horizonEdge = Math.min(sunProgress, 1 - sunProgress);
      const warm = clamp(1 - horizonEdge / 0.16, 0, 1) * (1 - nightFactor);
      if (warm > 0.01) {
        out[2] = mixRgb(out[2], [255, 168, 96], warm * 0.55);
        out[1] = mixRgb(out[1], [255, 190, 140], warm * 0.25);
      }
    }
    return out;
  }

  /* ---------- desenho ---------- */
  drawSky() {
    const ctx = this.ctx, w = this.w, h = this.h;
    const [c0, c1, c2] = this.skyPalette();
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0,    css(c0));
    g.addColorStop(0.55, css(c1));
    g.addColorStop(1,    css(c2));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
  }

  drawStars() {
    const ctx = this.ctx, t = this.t;
    ctx.save();
    for (const s of this.stars) {
      const a = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph));
      ctx.globalAlpha = a * this.state.nightFactor;
      ctx.fillStyle = '#eaf2ff';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  drawSun() {
    const ctx = this.ctx, w = this.w, h = this.h;
    const f = clamp(this.state.sunProgress, 0, 1);
    const x = w * (0.10 + 0.80 * f);
    const y = h * 0.72 - Math.sin(f * Math.PI) * h * 0.52;
    const r = 34;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r * 5.5);
    g.addColorStop(0,    'rgba(255,246,205,0.98)');
    g.addColorStop(0.12, 'rgba(255,225,140,0.75)');
    g.addColorStop(0.35, 'rgba(255,196,90,0.26)');
    g.addColorStop(1,    'rgba(255,170,60,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r * 5.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff7d4';
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }

  drawMoon() {
    const ctx = this.ctx, w = this.w, h = this.h;
    const nf = this.state.nightFactor;
    if (nf < 0.1) return;
    const x = w * 0.76, y = h * 0.20, r = 30;
    const phase = this.state.moonPhase;

    ctx.save();
    ctx.globalAlpha = nf;
    // brilho
    const glow = ctx.createRadialGradient(x, y, r * 0.5, x, y, r * 4);
    glow.addColorStop(0, 'rgba(210,225,255,0.26)');
    glow.addColorStop(1, 'rgba(210,225,255,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(x, y, r * 4, 0, Math.PI * 2); ctx.fill();

    ctx.save();
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.clip();
    // disco não iluminado (earthshine leve)
    ctx.fillStyle = '#20273b';
    ctx.fillRect(x - r, y - r, 2 * r, 2 * r);

    ctx.translate(x, y);
    if (phase > 0.5) ctx.scale(-1, 1);
    const pp = phase > 0.5 ? 1 - phase : phase;      // 0 → 0.5
    const xt = r * Math.cos(pp * 2 * Math.PI);
    const a  = Math.max(Math.abs(xt), 0.001);

    ctx.fillStyle = '#f4f0dd';
    ctx.beginPath();
    if (xt >= 0) ctx.ellipse(0, 0, a, r, 0, -Math.PI / 2, Math.PI / 2, false);
    else         ctx.ellipse(0, 0, a, r, 0, -Math.PI / 2, Math.PI / 2, true);
    ctx.arc(0, 0, r, Math.PI / 2, -Math.PI / 2, true);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
    ctx.restore();
  }

  drawClouds(dt) {
    const ctx = this.ctx;
    const nf = this.state.nightFactor;
    const dark = this.state.type === 'storm' ? 0.34 :
                 this.state.type === 'rain'  ? 0.55 : 1;
    for (const cl of this.clouds) {
      cl.x += (cl.v + this.state.windSpeed * 0.9) * dt;
      const sw = cl.sprite.width * cl.s;
      if (cl.x - sw > this.w + 200) cl.x = -sw - 200;
      if (cl.x < -sw - 400) cl.x = this.w + 200;

      ctx.save();
      ctx.globalAlpha = cl.a * (0.45 + 0.55 * (1 - nf * 0.35));
      try {
        const b = (dark * (1 - nf * 0.62)).toFixed(2);
        ctx.filter = `brightness(${b})`;
      } catch (e) { /* fallback */ }
      ctx.drawImage(cl.sprite, cl.x, cl.y, sw, cl.sprite.height * cl.s);
      ctx.restore();
    }
  }

  drawRain(dt) {
    const ctx = this.ctx;
    const wind = this.state.windSpeed * 0.9;
    ctx.save();
    ctx.lineCap = 'round';
    for (const d of this.rain) {
      d.y += d.spd * dt;
      d.x += wind * dt;
      if (d.y > this.h + 30) {
        d.y = rand(-120, -10);
        d.x = rand(-80, this.w + 80);
      }
      if (d.x > this.w + 60) d.x = -60;
      if (d.x < -80) d.x = this.w + 40;

      ctx.strokeStyle = `rgba(188,214,242,${d.a})`;
      ctx.lineWidth = d.th;
      ctx.beginPath();
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x - wind * 0.018, d.y - d.len);
      ctx.stroke();
    }
    ctx.restore();
  }

  drawSnow(dt) {
    const ctx = this.ctx;
    const t = this.t;
    ctx.save();
    ctx.fillStyle = '#ffffff';
    for (const f of this.snow) {
      f.y += f.spd * dt;
      f.x += (f.drift + Math.sin(t * 1.4 + f.ph) * 22) * dt;
      if (f.y > this.h + 20) { f.y = rand(-40, -10); f.x = rand(0, this.w); }
      if (f.x < -20) f.x = this.w + 10;
      if (f.x > this.w + 20) f.x = -10;
      ctx.globalAlpha = f.a;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  drawFog() {
    const ctx = this.ctx, w = this.w, h = this.h;
    const t = this.t;
    ctx.save();
    for (let i = 0; i < 5; i++) {
      const y = h * (0.30 + i * 0.13) + Math.sin(t * 0.4 + i) * 12;
      const g = ctx.createLinearGradient(0, y - 90, 0, y + 90);
      g.addColorStop(0,   'rgba(220,228,236,0)');
      g.addColorStop(0.5, `rgba(220,228,236,${0.06 + i * 0.012})`);
      g.addColorStop(1,   'rgba(220,228,236,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, y - 90, w, 180);
    }
    ctx.restore();
  }

  /* ---------- relâmpago ---------- */
  makeBolt() {
    const pts = [];
    let x = rand(this.w * 0.15, this.w * 0.85);
    let y = 0;
    const seg = 9 + Math.floor(Math.random() * 5);
    const stepY = (this.h * 0.62) / seg;
    for (let i = 0; i < seg; i++) {
      pts.push([x, y]);
      x += rand(-38, 38);
      y += stepY * rand(0.7, 1.2);
    }
    return pts;
  }

  updateLightning(dt) {
    const L = this.lightning;
    const isStorm = this.state.type === 'storm';
    if (!isStorm) { L.alpha = 0; L.bolt = null; L.next = rand(2, 6); return; }
    L.next -= dt;
    if (L.next <= 0) {
      L.next = rand(2.5, 7.5);
      L.alpha = 1;
      L.bolt = this.makeBolt();
      L.boltLife = 1;
    }
    L.alpha = Math.max(0, L.alpha - dt * 5.5);
    if (L.bolt) { L.boltLife -= dt * 2.2; if (L.boltLife <= 0) L.bolt = null; }
  }

  drawLightning() {
    const ctx = this.ctx, L = this.lightning;
    if (L.alpha <= 0.01 && !L.bolt) return;

    if (L.alpha > 0.01) {
      ctx.save();
      ctx.globalAlpha = L.alpha * 0.55;
      ctx.fillStyle = '#dfe9ff';
      ctx.fillRect(0, 0, this.w, this.h);
      ctx.restore();
    }
    if (L.bolt) {
      ctx.save();
      ctx.globalAlpha = clamp(L.boltLife, 0, 1) * 0.95;
      ctx.strokeStyle = '#eaf2ff';
      ctx.lineWidth = 2.4;
      ctx.shadowColor = '#9fc2ff';
      ctx.shadowBlur = 22;
      ctx.beginPath();
      ctx.moveTo(L.bolt[0][0], L.bolt[0][1]);
      for (let i = 1; i < L.bolt.length; i++) ctx.lineTo(L.bolt[i][0], L.bolt[i][1]);
      ctx.stroke();
      ctx.restore();
    }
  }

  /* ---------- loop ---------- */
  loop(ts) {
    if (!this._last) this._last = ts;
    const dt = Math.min((ts - this._last) / 1000, 0.05);
    this._last = ts;
    this.t += dt;

    if (this.dirty) this.build();

    const ctx = this.ctx;
    ctx.clearRect(0, 0, this.w, this.h);

    this.drawSky();
    this.drawStars();
    if (this.state.nightFactor < 0.65) this.drawSun();
    this.drawMoon();
    this.drawClouds(dt);

    if (this.state.type === 'fog') this.drawFog();
    if (this.rain.length)  this.drawRain(dt);
    if (this.snow.length)  this.drawSnow(dt);

    this.updateLightning(dt);
    this.drawLightning();

    requestAnimationFrame(this.loop);
  }
}

/* =========================================================
   FASE DA LUA
   ========================================================= */
function moonPhase(date) {
  const SYNODIC = 29.530588853;
  const known = Date.UTC(2000, 0, 6, 18, 14) / 86400000;
  const days = date.getTime() / 86400000 - known;
  let p = (days % SYNODIC) / SYNODIC;
  if (p < 0) p += 1;
  return p; // 0 = nova, 0.5 = cheia
}

/* =========================================================
   INTEGRAÇÃO COM API — Open-Meteo (sem chave)
   ========================================================= */
async function fetchWeather(lat, lon) {
  const url = 'https://api.open-meteo.com/v1/forecast'
    + `?latitude=${lat}&longitude=${lon}`
    + '&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,'
    + 'precipitation,rain,weather_code,cloud_cover,pressure_msl,'
    + 'wind_speed_10m,wind_direction_10m,wind_gusts_10m'
    + '&hourly=temperature_2m,weather_code,precipitation_probability,precipitation,'
    + 'uv_index,visibility,is_day'
    + '&daily=sunrise,sunset'
    + '&timezone=auto&forecast_days=2';

  const res = await fetch(url);
  if (!res.ok) throw new Error('Falha na API: ' + res.status);
  return res.json();
}

/* =========================================================
   APLICAÇÃO
   ========================================================= */
const fx = new WeatherEffects(document.getElementById('sky'));

const $ = id => document.getElementById(id);
let currentType = 'clear';
let manualPreview = false;

function computeNightFactor(now, sunrise, sunset) {
  const tw = 45 * 60 * 1000;
  const t = now.getTime();
  const sr = sunrise.getTime(), ss = sunset.getTime();
  if (t < sr - tw) return 1;
  if (t < sr + tw) return 1 - (t - (sr - tw)) / (2 * tw);
  if (t < ss - tw) return 0;
  if (t < ss + tw) return (t - (ss - tw)) / (2 * tw);
  return 1;
}

function render(data, cityLabel) {
  const cur = data.current;
  const info = getWMO(cur.weather_code);
  currentType = info.type;

  const now = new Date();
  const idx = data.hourly.time.findIndex(t => new Date(t) >= now);
  const hi = idx >= 0 ? idx : 0;

  const sunrise = new Date(data.daily.sunrise[0]);
  const sunset  = new Date(data.daily.sunset[0]);
  const nf = computeNightFactor(now, sunrise, sunset);
  const isDay = nf < 0.5;

  let sunProgress = 0.5;
  const total = sunset - sunrise;
  if (total > 0) sunProgress = clamp((now - sunrise) / total, 0, 1);

  if (!manualPreview) {
    fx.apply({
      code: cur.weather_code,
      precip: cur.precipitation ?? 0,
      cloudCover: cur.cloud_cover ?? 0,
      windSpeed: cur.wind_speed_10m ?? 0,
      isDay,
      nightFactor: nf,
      sunProgress,
      moonPhase: moonPhase(now),
    });
  }

  $('city').textContent  = cityLabel;
  $('temp').textContent  = Math.round(cur.temperature_2m) + '°';
  $('icon').textContent  = info.icon;
  $('label').textContent = info.label;
  $('feels').textContent = `Sensação ${Math.round(cur.apparent_temperature)}° · `
    + `${isDay ? 'Dia' : 'Noite'}`;

  $('hum').textContent   = (cur.relative_humidity_2m ?? '—') + '%';
  $('wind').textContent  = Math.round(cur.wind_speed_10m ?? 0) + ' km/h';
  $('press').textContent = Math.round(cur.pressure_msl ?? 0) + ' hPa';
  $('precip').textContent= (cur.precipitation ?? 0).toFixed(1) + ' mm';
  $('uv').textContent    = (data.hourly.uv_index?.[hi] ?? 0).toFixed(0);
  $('vis').textContent   = ((data.hourly.visibility?.[hi] ?? 0) / 1000).toFixed(0) + ' km';

  // previsão horária
  const hoursEl = $('hours');
  hoursEl.innerHTML = '';
  for (let i = hi; i < Math.min(hi + 14, data.hourly.time.length); i++) {
    const d = new Date(data.hourly.time[i]);
    const hInfo = getWMO(data.hourly.weather_code[i]);
    const el = document.createElement('div');
    el.className = 'hour';
    el.innerHTML = `<div class="h">${String(d.getHours()).padStart(2, '0')}h</div>
                    <div class="i">${hInfo.icon}</div>
                    <div class="t">${Math.round(data.hourly.temperature_2m[i])}°</div>`;
    hoursEl.appendChild(el);
  }

  // marca botão ativo do preview
  document.querySelectorAll('#preview button[data-type]').forEach(b => {
    b.classList.toggle('on', !manualPreview && b.dataset.type === currentType);
  });
}

async function loadCity(lat, lon, label) {
  $('status').textContent = 'Carregando dados…';
  try {
    const data = await fetchWeather(lat, lon);
    render(data, label);
    $('status').textContent =
      `Última atualização: ${new Date().toLocaleTimeString('pt-BR')} · Fonte: Open-Meteo`;
  } catch (e) {
    console.error(e);
    $('status').textContent = 'Erro ao carregar — modo de simulação ativo.';
    fx.preview('rain', true);
  }
}

/* ---------- eventos ---------- */
document.querySelectorAll('#preview button').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.dataset.toggle === 'daynight') {
      const cur = btn.classList.contains('on');
      btn.classList.toggle('on', !cur);
      const isDay = cur; // se estava noite → vira dia
      manualPreview = true;
      fx.preview(currentType === 'clear' ? 'clear' : currentType, isDay);
      return;
    }
    manualPreview = true;
    document.querySelectorAll('#preview button[data-type]')
      .forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    const isDay = !document.querySelector('[data-toggle="daynight"]').classList.contains('on');
    fx.preview(btn.dataset.type, isDay);
  });
});

$('citySel').addEventListener('change', e => {
  manualPreview = false;
  const [lat, lon] = e.target.value.split(',').map(Number);
  loadCity(lat, lon, e.target.options[e.target.selectedIndex].text);
});

/* ---------- inicialização ---------- */
(function init() {
  // constrói sprites antes do primeiro frame
  for (let i = 0; i < 5; i++) fx.cloudSprites.push(fx.makeCloudSprite());

  const defaultCity = { lat: -23.5505, lon: -46.6333, name: 'São Paulo' };

  const start = (lat, lon, name) => loadCity(lat, lon, name);

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => start(pos.coords.latitude, pos.coords.longitude, 'Sua localização'),
      () => start(defaultCity.lat, defaultCity.lon, defaultCity.name),
      { timeout: 8000, maximumAge: 600000 }
    );
  } else {
    start(defaultCity.lat, defaultCity.lon, defaultCity.name);
  }

  // atualiza a cada 10 minutos
  setInterval(() => {
    if (manualPreview) return;
    const [lat, lon] = ($('citySel').value).split(',').map(Number);
    loadCity(lat, lon, $('citySel').selectedOptions[0].text);
  }, 10 * 60 * 1000);
})();
</script>
