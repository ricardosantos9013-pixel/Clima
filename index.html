<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2a5b">
<meta name="description" content="Clima em tempo real com alertas de chuva, neve, tempestade, tornado e furacão. Previsão de 7 dias para qualquer cidade do mundo.">
<title>Clima Alerta | Tempo, Lua, radar e energia</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" crossorigin="">
<style>
:root{
  --bg1:#0b2a5b; --bg2:#2d8cff; --card:rgba(255,255,255,.14); --borda:rgba(255,255,255,.22);
  --txt:#fff; --suave:rgba(255,255,255,.75);
  --a1:#f5c518; --a2:#ff8a1f; --a3:#e5243b; --a0:#22c55e;
  --z:1;
  --fonte:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
body.t-noite{--bg1:#050b1f;--bg2:#1b2a63}
body.t-chuva{--bg1:#1b2b45;--bg2:#4a6a8f}
body.t-neve{--bg1:#4a6585;--bg2:#a9c4de}
body.t-tempestade{--bg1:#120d26;--bg2:#46386b}
body.t-nublado{--bg1:#2d3f5c;--bg2:#7b93b3}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--fonte);color:var(--txt);min-height:100vh;background:var(--bg1);line-height:1.45;padding-bottom:30px}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(170deg,var(--bg1),var(--bg2))}
button,input{font-family:inherit}
.container{width:min(760px,94%);margin:auto}

/* Busca */
.topo{position:sticky;top:0;z-index:30;padding:max(10px,env(safe-area-inset-top)) 0 10px;background:linear-gradient(180deg,rgba(0,0,0,.28),transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.busca{display:flex;gap:8px}
.busca input{flex:1;min-width:0;border:1px solid var(--borda);background:rgba(255,255,255,.18);color:#fff;border-radius:50px;padding:13px 18px;font-size:calc(16px*var(--z));outline:none}
.busca input::placeholder{color:var(--suave)}
.busca input:focus{background:rgba(255,255,255,.26)}
.ib{flex:none;width:48px;height:48px;border-radius:50%;border:1px solid var(--borda);background:var(--card);color:#fff;font-size:calc(20px*var(--z));cursor:pointer}
.ib:active{transform:scale(.94)}
.ib.ativo{background:#fff;color:#0b2a5b}
.sugestoes{list-style:none;position:absolute;left:3%;right:3%;max-width:760px;margin:6px auto 0;background:#fff;color:#12203a;border-radius:18px;overflow:hidden;box-shadow:0 16px 40px rgba(0,0,0,.4)}
.sugestoes li{padding:13px 16px;border-bottom:1px solid #e6edf8;cursor:pointer;font-size:calc(15px*var(--z))}
.sugestoes li:last-child{border:0}
.sugestoes li small{display:block;color:#5a6b87;font-size:calc(12.5px*var(--z))}
.favs{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.favs::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--borda);background:var(--card);color:#fff;border-radius:50px;padding:6px 14px;font-size:calc(13px*var(--z));cursor:pointer;white-space:nowrap}

.status{margin:14px 0;padding:12px 16px;border-radius:16px;background:var(--card);border:1px solid var(--borda);font-size:calc(14px*var(--z))}
.status.erro{background:rgba(229,36,59,.35)}

/* Alertas */
.sec-titulo{font-size:calc(13px*var(--z));font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--suave);margin:22px 0 10px}
.alerta{display:flex;gap:12px;border-radius:18px;padding:14px 16px;margin-bottom:10px;color:#101828;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.alerta .ic{font-size:calc(30px*var(--z));line-height:1}
.alerta b{display:block;font-size:calc(16px*var(--z))}
.alerta p{font-size:calc(13.5px*var(--z));margin-top:3px}
.alerta small{display:block;margin-top:6px;font-size:calc(11.5px*var(--z));opacity:.75;font-weight:700}
.alerta.n1{background:var(--a1)}
.alerta.n2{background:var(--a2)}
.alerta.n3{background:var(--a3);color:#fff}
.alerta.n0{background:rgba(34,197,94,.9);color:#05260f}
.oficiais a{display:inline-block;margin:4px 8px 0 0;font-size:calc(13px*var(--z));color:#fff;text-decoration:underline}

/* Agora */
.hero{text-align:center;padding:10px 0 4px}
.hero .cidade{font-size:calc(26px*var(--z));font-weight:800;display:flex;justify-content:center;align-items:center;gap:8px}
.star{background:none;border:0;font-size:calc(24px*var(--z));cursor:pointer;color:#fff}
.hero .sub{color:var(--suave);font-size:calc(14px*var(--z))}
.hero .temp{font-size:calc(92px*var(--z));font-weight:200;line-height:1;margin:6px 0 0;letter-spacing:-3px}
.hero .icone{font-size:calc(64px*var(--z));line-height:1.1}
.hero .desc{font-size:calc(19px*var(--z));font-weight:600}
.hero .mm{color:var(--suave);font-size:calc(14.5px*var(--z));margin-top:2px}

.card{background:var(--card);border:1px solid var(--borda);border-radius:22px;padding:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.m{background:var(--card);border:1px solid var(--borda);border-radius:18px;padding:12px 8px;text-align:center}
.m span{display:block;font-size:calc(11.5px*var(--z));color:var(--suave);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.m b{display:block;font-size:calc(19px*var(--z));margin-top:3px}
.m small{font-size:calc(11.5px*var(--z));color:var(--suave)}

.horas{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.horas::-webkit-scrollbar{display:none}
.h{flex:none;width:58px;text-align:center;font-size:calc(13px*var(--z))}
.h .e{font-size:calc(24px*var(--z));margin:4px 0}
.h .p{color:#9fe0ff;font-size:calc(11.5px*var(--z));min-height:16px}

.dia{display:grid;grid-template-columns:70px 32px 42px 1fr 66px;gap:8px;align-items:center;padding:11px 0;border-bottom:1px solid var(--borda);font-size:calc(15px*var(--z))}
.dia:last-child{border:0}
.dia .n{font-weight:700;text-transform:capitalize}
.dia .e{font-size:calc(24px*var(--z));text-align:center}
.dia .p{color:#9fe0ff;font-size:calc(12.5px*var(--z));text-align:center}
.dia .t{text-align:right;white-space:nowrap}
.dia .mn{color:var(--suave)}
.dia .mx{font-weight:700}
.barra{position:relative;height:6px;border-radius:6px;background:rgba(255,255,255,.2)}
.barra i{position:absolute;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,#7dd3fc,#fde047,#fb923c)}
.dia .x{grid-column:1/-1;font-size:calc(12px*var(--z));color:var(--suave);margin-top:-6px}

/* Energia */
.energia{background:var(--card);border:1px solid var(--borda);border-radius:22px;padding:16px}
.risco{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.risco .sel{flex:none;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:calc(28px*var(--z));color:#101828}
.risco.r0 .sel{background:var(--a0)}
.risco.r1 .sel{background:var(--a1)}
.risco.r2 .sel{background:var(--a2)}
.risco.r3 .sel{background:var(--a3);color:#fff}
.risco b{display:block;font-size:calc(17px*var(--z))}
.risco small{color:var(--suave);font-size:calc(13px*var(--z))}
.energia p{font-size:calc(14px*var(--z))}
.energia ul{list-style:none;margin:8px 0 4px}
.energia li{font-size:calc(14px*var(--z));padding:3px 0}
.energia li::before{content:"• ";color:var(--suave)}
.energia .nota{font-size:calc(12px*var(--z));color:var(--suave);margin-top:10px}
.energia h4{font-size:calc(13px*var(--z));text-transform:uppercase;letter-spacing:.8px;color:var(--suave);margin:16px 0 8px}
.atalhos{display:grid;gap:8px}
.atalhos a{display:block;background:rgba(255,255,255,.16);border:1px solid var(--borda);border-radius:16px;padding:12px 14px;color:#fff;text-decoration:none}
.atalhos a b{display:block;font-size:calc(15px*var(--z))}
.atalhos a span{color:var(--suave);font-size:calc(12.5px*var(--z))}


/* Interativo: abas, resumo e detalhes */
html.grande{--z:1.22}
body{padding-bottom:104px}
.tab{display:none}
.tab.ativo{display:block;animation:ent .25s ease}
@keyframes ent{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.abas{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:space-around;gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(8,16,40,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--borda)}
.aba{position:relative;flex:1;max-width:130px;border:0;background:none;color:var(--suave);padding:6px 4px;border-radius:16px;font-size:calc(11.5px*var(--z));font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.aba .i{font-size:calc(24px*var(--z));line-height:1.1}
.aba.ativo{background:rgba(255,255,255,.2);color:#fff}
.aba .bd{position:absolute;top:0;right:14%;min-width:18px;height:18px;border-radius:9px;font-size:calc(11px*var(--z));display:none;place-items:center;padding:0 5px;color:#101828;font-weight:800}
.aba .bd.on{display:grid}
.acoes{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.mini{border:1px solid var(--borda);background:var(--card);color:#fff;border-radius:50px;padding:9px 16px;font-size:calc(13.5px*var(--z));font-weight:700;cursor:pointer}
.mini:active{transform:scale(.95)}
.atual{color:var(--suave);font-size:calc(12px*var(--z));margin-top:8px}
.resumo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 4px}
.rc{border:0;text-align:left;border-radius:18px;padding:14px;color:#101828;cursor:pointer;font-family:inherit}
.rc:active{transform:scale(.97)}
.rc span{display:block;font-size:calc(12px*var(--z));font-weight:800;text-transform:uppercase;letter-spacing:.6px;opacity:.75}
.rc b{display:block;font-size:calc(19px*var(--z));margin:2px 0}
.rc small{font-size:calc(12.5px*var(--z));opacity:.85}
.rc.n0{background:var(--a0)}
.rc.n1{background:var(--a1)}
.rc.n2{background:var(--a2)}
.rc.n3{background:var(--a3);color:#fff}
.rc.largo{grid-column:1/-1;background:var(--card);color:#fff;border:1px solid var(--borda)}
.dia{cursor:pointer}
.det{grid-column:1/-1;display:none;grid-template-columns:1fr 1fr;gap:10px 12px;background:rgba(255,255,255,.1);border-radius:14px;padding:12px;font-size:calc(13.5px*var(--z))}
.dia.aberto .det{display:grid}
.det .cond{grid-column:1/-1;font-weight:800;font-size:calc(15px*var(--z))}
.det span{color:var(--suave)}
.det b{font-size:calc(15px*var(--z))}
.dica{color:var(--suave);font-size:calc(12.5px*var(--z));text-align:center;margin-top:10px}

/* Cena animada, lua, cronograma e radar */
#cena{position:fixed;inset:0;z-index:0;pointer-events:none}
main{position:relative;z-index:1}
.astro{position:relative;width:132px;height:132px;margin:4px auto 0}
.astro svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.astro .raios{transform-origin:60px 60px;animation:gira 50s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.astro .pulso{transform-origin:60px 60px;animation:pulso 4s ease-in-out infinite}
@keyframes pulso{50%{transform:scale(1.06)}}
.astro .flut{animation:flut 6s ease-in-out infinite}
@keyframes flut{50%{transform:translateX(7px)}}
.cenatxt{font-size:calc(14px*var(--z));font-weight:700;margin-top:4px}
.lua-card{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--borda);border-radius:22px;padding:14px}
.lua-card svg{flex:none;width:84px;height:84px}
.lua-card b{display:block;font-size:calc(19px*var(--z))}
.lua-card small{display:block;color:var(--suave);font-size:calc(13px*var(--z));margin-top:2px}
.desl{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--borda)}
.desl.p{border-top:0;padding-top:4px}
.desl .dd{flex:none;width:74px;text-align:center;background:rgba(255,255,255,.14);border-radius:14px;padding:8px 4px;font-size:calc(12.5px*var(--z));text-transform:capitalize}
.desl .dd b{display:block;font-size:calc(17px*var(--z))}
.desl .dd em{display:inline-block;margin-top:3px;font-style:normal;font-size:calc(10.5px*var(--z));font-weight:800;background:var(--a2);color:#101828;border-radius:8px;padding:1px 6px}
.desl .tx{font-size:calc(14px*var(--z))}
.desl .tx small{color:var(--suave);font-size:calc(12.5px*var(--z))}
.desl .tx a{color:#fff}
.cron-b{margin-top:10px}
#mapa{position:relative;z-index:1;isolation:isolate;height:60vh;min-height:360px;border-radius:22px;overflow:hidden;border:1px solid var(--borda);background:#0b1430}
.radar-ctrl{display:flex;align-items:center;gap:10px;margin-top:10px}
.radar-ctrl input{flex:1;min-width:0}
.radar-ctrl span{font-size:calc(13px*var(--z));min-width:104px;text-align:right}
.atrib{font-size:calc(11.5px*var(--z));color:var(--suave);margin-top:8px}
.atrib a{color:#fff}

footer{margin-top:26px;font-size:calc(12px*var(--z));color:var(--suave);text-align:center;padding:0 6px}
footer a{color:#fff}
.hide{display:none!important}
@media(max-width:380px){.dia{grid-template-columns:62px 28px 38px 1fr 62px}.hero .temp{font-size:calc(80px*var(--z))}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<canvas id="cena" aria-hidden="true"></canvas>

<div class="topo">
  <div class="container">
    <div class="busca">
      <input id="q" type="search" placeholder="Buscar cidade (ex.: Miami, Tóquio, Marília)" autocomplete="off" enterkeyhint="search" aria-label="Buscar cidade">
      <button class="ib" id="btnBuscar" aria-label="Buscar">🔍</button>
      <button class="ib" id="btnGps" aria-label="Usar minha localização">📍</button>
      <button class="ib hide" id="btnNotif" aria-label="Ativar notificações">🔔</button>
    </div>
    <ul class="sugestoes hide" id="sugestoes"></ul>
    <div class="favs" id="favs"></div>
  </div>
</div>

<main class="container">
  <div class="status" id="status">Buscando sua localização…</div>

  <div id="app" class="hide">

    <section class="tab ativo" id="tab-agora">
      <div class="hero">
        <div class="cidade"><span id="cidade">—</span><button class="star" id="btnFav" aria-label="Salvar cidade">☆</button></div>
        <div class="sub" id="sub">—</div>
        <div class="astro" id="astro"></div>
        <div class="cenatxt" id="cenaTxt"></div>
        <div class="temp" id="temp">—</div>
